services:
  dev:
    build:
      context: .
      target: development
    working_dir: /app
    ports:
      - '5173:5173'
    volumes:
      - .:/app
      - dev_node_modules:/app/node_modules
      - pnpm_store:/pnpm/store
    command:
      - sh
      - -c
      - pnpm install --frozen-lockfile && pnpm dev
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:5173').then((response)=>process.exit(response.ok?0:1)).catch(()=>process.exit(1))
      interval: 2s
      timeout: 2s
      start_period: 2s
      retries: 30
    networks:
      default:
        aliases:
          - moon-courier-vite
    init: true

  verify:
    build:
      context: .
      target: verify
    init: true

  e2e-app:
    build:
      context: .
      target: development
    working_dir: /app
    ports:
      - '5174:5173'
    volumes:
      - .:/app
      - e2e_app_node_modules:/app/node_modules
      - pnpm_store:/pnpm/store
    command:
      - sh
      - -c
      - pnpm install --frozen-lockfile && pnpm exec vite --host 0.0.0.0 --mode e2e
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:5173').then((response)=>process.exit(response.ok?0:1)).catch(()=>process.exit(1))
      interval: 2s
      timeout: 2s
      start_period: 2s
      retries: 30
    networks:
      default:
        aliases:
          - moon-courier-e2e-vite
    init: true

  e2e:
    image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
    working_dir: /app
    depends_on:
      e2e-app:
        condition: service_healthy
    volumes:
      - .:/app
      - e2e_node_modules:/app/node_modules
      - pnpm_store:/pnpm/store
    environment:
      PLAYWRIGHT_BASE_URL: http://moon-courier-e2e-vite:5173
    ipc: host
    init: true
    command:
      - bash
      - -lc
      - corepack enable && pnpm install --frozen-lockfile --store-dir=/pnpm/store && pnpm test:e2e

  app:
    build:
      context: .
      target: runtime
    ports:
      - '8080:8080'
    networks:
      default:
        aliases:
          - moon-courier-nginx

volumes:
  dev_node_modules:
  e2e_app_node_modules:
  e2e_node_modules:
  pnpm_store:
